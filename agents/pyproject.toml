[project]
name = "agentic-ta-agents"
version = "0.1.0"
description = "AgenticTA agent service: FastAPI + LangChain v1 + LangGraph, traced in LangSmith"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "pydantic>=2.9",
    "langchain>=1.0",
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=2.0",
    "langsmith>=0.3",
    "langchain-openai>=1.0",
    "langchain-anthropic>=1.0",
    "langchain-google-genai>=2.0",
    "langchain-ollama>=0.3",
    "sqlite-vec>=0.1.6",
    "fastembed>=0.4",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "python-pptx>=1.0",
]

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.27"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
